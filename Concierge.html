<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Logbook Concierge</title>
  <meta name="apple-mobile-web-app-title" content="Logbook Concierge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="assets/images/icone-concierge.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icone-concierge.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
    #ecranChargement {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #16A34A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #ecranChargement img { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 18px; }
    #ecranChargement p { color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; margin: 0; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.35);
      border-radius: 50%; border-top-color: white; animation: tourner 0.8s linear infinite; margin-top: 14px;
    }
    @keyframes tourner { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ecranChargement">
    <img src="assets/images/icone-concierge.png" alt="">
    <p>Chargement du tableau de bord…</p>
    <div class="spinner"></div>
  </div>
  <iframe
    id="logbookFrame"
    src="https://script.google.com/macros/s/AKfycbxmpZPhq-TftwUenRqWjByP7hRTVoB9gFrfHWMP8WjGvgyKF7cxH044g9OzAxU0O1jHPA/exec?profil=concierge"
    allow="geolocation"
    onload="document.getElementById('ecranChargement').style.display='none';"
  ></iframe>
  <script>
    var urlBase = "https://script.google.com/macros/s/AKfycbxmpZPhq-TftwUenRqWjByP7hRTVoB9gFrfHWMP8WjGvgyKF7cxH044g9OzAxU0O1jHPA/exec?profil=concierge";
    if (window.location.search) {
      document.getElementById('logbookFrame').src = urlBase + window.location.search;
    }
  </script>
</body>
</html>
