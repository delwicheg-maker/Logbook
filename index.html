<!-- ============================================================
     LOGBOOK DIGITAL — Wrapper GitHub Pages — App OUVRIER (QR Code)
     VERSION 1.9 — ANNULATION de la v1.8 : forcer le rendu en
                   masquant/réaffichant tout le <body> a provoqué un
                   blocage complet sur iPhone (chargement qui
                   n'aboutit jamais). Retour au simple masquage de
                   l'écran de chargement au onload, sans manipulation
                   du body.
     VERSION 1.8 — [ANNULÉE, voir ci-dessus] Correctif d'affichage
                   Android : le gestionnaire onload forçait un
                   nouveau rendu explicite du navigateur.
     VERSION 1.7 — Rangement : l'icône déménage de la racine vers
                   assets/images/icone-ouvrier.png, pour un dépôt
                   plus propre. Simple changement de chemin, aucun
                   changement de comportement.
     VERSION 1.6 — Icône remplacée : texte base64 (15-30 Ko à décoder
                   à chaque chargement, coûteux en calcul sur
                   d'anciens téléphones) remplacé par un vrai fichier
                   image (icone-ouvrier.png, alors à la racine)
                   hébergé directement sur GitHub Pages — chargement
                   asynchrone standard, mis en cache par le
                   navigateur, aucun décodage requis.
     VERSION 1.5 — Robustesse de l'écran de chargement face au cache
                   de navigation (bfcache).
     VERSION 1.4 — Optimisation de la vitesse perçue (preconnect +
                   écran de chargement).
     VERSION 1.3 — Ajout de manifest-ouvrier.json.
     VERSION 1.2 — Transmission des paramètres d'URL vers l'iframe.
     VERSION 1.1 — Icône + titre pour "Ajouter à l'écran d'accueil".
     VERSION 1.0 — Wrapper iframe initial.
     ============================================================ -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Logbook Digital</title>
  <meta name="apple-mobile-web-app-title" content="Logbook Digital">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest-ouvrier.json">
  <link rel="icon" type="image/png" href="assets/images/icone-ouvrier.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icone-ouvrier.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
    #ecranChargement {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #16A34A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #ecranChargement img { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 18px; }
    #ecranChargement p { color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; margin: 0; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.35);
      border-radius: 50%; border-top-color: white; animation: tourner 0.8s linear infinite; margin-top: 14px;
    }
    @keyframes tourner { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ecranChargement">
    <img src="assets/images/icone-ouvrier.png" alt="">
    <p>Chargement…</p>
    <div class="spinner"></div>
  </div>
  <iframe
    id="logbookFrame"
    src="https://script.google.com/macros/s/AKfycbxmpZPhq-TftwUenRqWjByP7hRTVoB9gFrfHWMP8WjGvgyKF7cxH044g9OzAxU0O1jHPA/exec"
    allow="geolocation"
    onload="document.getElementById('ecranChargement').style.display='none';"
  ></iframe>
  <script>
    var urlBase = "https://script.google.com/macros/s/AKfycbxmpZPhq-TftwUenRqWjByP7hRTVoB9gFrfHWMP8WjGvgyKF7cxH044g9OzAxU0O1jHPA/exec";
    if (window.location.search) {
      document.getElementById('logbookFrame').src = urlBase + window.location.search;
    }

    window.addEventListener('pageshow', function(evenement) {
      var ecran = document.getElementById('ecranChargement');
      if (evenement.persisted) {
        ecran.style.transition = 'none';
        ecran.style.opacity = '0';
        ecran.style.display = 'none';
      } else {
        ecran.style.transition = '';
        ecran.style.display = 'flex';
        ecran.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
